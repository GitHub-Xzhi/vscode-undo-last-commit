name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号 / Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 检查 tag 是否存在 / Check if tag exists
        id: tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists, skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist, will create"
          fi

      - name: 配置 git / Configure git
        if: steps.tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 创建并推送 tag / Create and push tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created and pushed tag $TAG"

      - name: 安装依赖 / Install dependencies
        if: steps.tag.outputs.exists == 'false'
        run: npm install

      - name: 编译 / Compile
        if: steps.tag.outputs.exists == 'false'
        run: npm run compile

      - name: 打包 vsix / Package vsix
        if: steps.tag.outputs.exists == 'false'
        run: npx @vscode/vsce package --no-dependencies

      - name: 上传 artifact / Upload artifact
        if: steps.tag.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: undo-last-commit-${{ steps.version.outputs.version }}
          path: "*.vsix"
